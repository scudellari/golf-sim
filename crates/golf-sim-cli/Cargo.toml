[package]
name = "golf-sim-cli"
description = "The golf program: play, replay, batch and the tools, over the golf-sim core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "golf"
path = "src/main.rs"

[dependencies]
golf-sim.workspace = true
golf-sim-validate.workspace = true
# `golf corpus` reuses the tolerance comparisons the tests use.
golf-sim-testkit.workspace = true
clap = { workspace = true, features = ["string"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
