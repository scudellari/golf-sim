[package]
name = "golf-sim-cli"
description = "The golf program: play, replay, batch and the tools, over the golf-sim core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "golf"
path = "src/main.rs"

[features]
# Test-only: mirror the reference implementation (single-precision vectors, the platform's maths).
reference = ["golf-sim/reference"]

[dependencies]
golf-sim.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
