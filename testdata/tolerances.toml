# Edit this table under testdata/ and copy it to crates/golf-sim-testkit/ for packaging.
# Starting bounds from docs/design/core.md, with lengths in metres and times in seconds.
# A number passes if it meets any bound on its row. f32_steps = k allows k × 2^-23 × s,
# where s is the largest of 1, the expected magnitude (largest component for a vector),
# and the magnitudes at the case paths in scale_from. The longest matching field row
# overrides the default bounds. [*] matches any index, with literal indices preferred
# for keys of equal length. A full fixture key overrides its layer row.

[math]
abs = 0.0
rel = 1e-6
scalar_ulps = 4
discrete_share = 0.0

[seed]
abs = 0.0
rel = 0.0
discrete_share = 0.0
fields = { gaussian = { abs = 0.0, rel = 1e-12 } }

[geometry]
abs = 0.0
rel = 0.0
discrete_share = 0.0

[variant]
abs = 0.0
rel = 0.0
discrete_share = 0.0

[records]
abs = 0.0
rel = 0.0
discrete_share = 0.0

[course]
abs = 0.0
rel = 0.0
f32_steps = 8
discrete_share = 0.0

[physics]
abs = 1e-6
rel = 1e-5
f32_steps = 8
discrete_share = 0.0

[world]
abs = 1e-6
