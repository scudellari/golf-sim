# The licence ledger of the validation targets. Every data file in this folder is listed under the
# dataset whose terms cover it. Verdicts: commit (openly licensed, committed with attribution), cite
# (individual measured values with their source), fetch (downloaded when a fit runs, never committed),
# local (kept out of this repository until the owner decides; the suite skips it when absent),
# excluded (not used). The licences are a reading of each source's terms, not legal advice.

format = 1
checked_on = "2026-11-26"

[datasets.biber-2023]
sources = ["BIB"]
verdict = "commit"
licence = "CC BY 4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
checked = "https://api.crossref.org/works/10.1007/s12283-023-00442-4"
terms = "Open access. Crossref records CC BY 4.0 for the version of record from 2023-12-01. The publisher's page refused automated fetches, so its own licence text and the supplement's file list were not seen."
attribution = "Data from J. Biber, T. Jones, A. Champneys, R. Green and R. Szalai, \"Measurements and linearized models for golf ball bounce on a green\", Sports Engineering (2023), https://doi.org/10.1007/s12283-023-00442-4, Online Resource 2, licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)."
changes = "The two CSV files are unmodified. bib.json restates their rows in m/s and rad/s (columns times the ball radius 0.021335 m for velocity) and adds the earlier implementation's predictions."
use = "Turf rebound: 543 natural-turf trials fit, 150 held out in five blocks of 30, and the artificial-turf campaign for comparison."
files = ["bib.json", "biber-2023/data_campaignA.csv", "biber-2023/data_campaignB.csv"]
checked_on = "2026-11-26"

